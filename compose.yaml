services:
  website:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your public HTTPS address}
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /app/data/samp.sqlite
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-disabled}
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8080}:3001"
    volumes:
      - inquiry-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  inquiry-data:
